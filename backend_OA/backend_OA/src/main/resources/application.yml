spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/open_academy
    username: postgres
    password: Deep@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   
    show-sql: true       
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        '[format_sql]': true
        hbm2ddl:
          auto: update

logging:
  level:
    '[org.hibernate.SQL]': DEBUG                 
    '[org.hibernate.type.descriptor.sql.BasicBinder]': TRACE 
    '[org.hibernate.orm.schema]': DEBUG  