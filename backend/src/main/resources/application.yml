spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/open_academy
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true
        hbm2ddl:
          auto: update

logging:
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql.BasicBinder]": TRACE
    "[org.hibernate.orm.schema]": DEBUG


# ===============================
# SECURITY CONFIGURATION
# ===============================

security:
  jwt:
    # Maps to @Value("${security.jwt.secret-key}")
    secret-key: ${SECRET_KEY}
  admin:
    # Maps to @Value("${security.admin.email}")
    email: ${SECURITY_ADMIN_EMAIL}
    # Maps to @Value("${security.admin.password}")
    password: ${SECURITY_ADMIN_PASSWORD}
    # Rescue flag if password to master admin was forgotten
    force-reset: ${SECURITY_FORCE_RESET:false}